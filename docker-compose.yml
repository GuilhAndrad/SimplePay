services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: "Server=mysql;Database=SimplePayDB;Uid=root;Pwd=${DB_PASSWORD:-SimplePay_Dev_2026};"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-SimplePay_Dev_2026}
      MYSQL_DATABASE: SimplePayDB
    ports:
      - "3306:3306"
    volumes:
      - simplepay-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-SimplePay_Dev_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simplepay-mysql-data: